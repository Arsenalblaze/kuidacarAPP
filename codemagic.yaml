
workflows:
  kuidacar-ios:
    name: KuidaCar iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build React and Vite
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build iOS application
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload

          cp -R build/ios/DerivedData/Build/Products/Release-iphoneos/App.app \
            build/ios/ipa/Payload/

          cd build/ios/ipa

          zip -r KuidaCar-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
